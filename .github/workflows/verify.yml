name: verify

on:
  workflow_dispatch:
    inputs:
      statement_id:
        description: "Statement id, e.g. S001 or C001"
        required: true
        type: string
      submission:
        description: "Path to the submission manifest, e.g. Submissions/S001/AliceDirect.json"
        required: true
        type: string
      ref:
        description: "Git ref holding the submission (defaults to this workflow's ref)"
        required: false
        type: string
      artifact_id:
        description: "Conject artifact uuid to settle. Derived from the submission filename when omitted."
        required: false
        type: string
      lane:
        description: "Verification budget. `heavy` is for work that genuinely needs it; a certificate checked in it is measurement-grade, because the check is the expensive part."
        required: false
        default: "default"
        type: choice
        options: [default, heavy, long]
      max_shards:
        description: "How many runners a wave of a pinned package may use (default 12)"
        required: false
        type: string
      min_per_shard:
        description: "Smallest number of modules a shard is worth (default 150)"
        required: false
        type: string
  pull_request:
  push:
    branches: [main]

concurrency:
  # Per submission, not per ref. Every API dispatch targets main, so a ref-wide
  # group made three artifacts submitted seconds apart cancel each other and left
  # two pending forever. Push and PR runs carry no inputs and still coalesce.
  group: verify-${{ github.ref }}-${{ github.event_name }}-${{ github.event.inputs.artifact_id || github.event.inputs.submission || 'branch' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The driver's own wall budget, always under the job timeout so it writes a RED
  # verdict itself rather than being killed mid-flight.
  #
  # The budget is not a cost control: these are GitHub's runners, and the graph
  # pays nothing either way. It is a trust control. A verification nobody can
  # afford to repeat is not much better than testimony, so the default stays
  # tight and anything slower has to ask, in the open, on the record.
  #
  # `long` is for Lean builds only (a pinned package of thousands of modules): proof
  # grade does not depend on compile time. It runs up to GitHub's 6-hour job ceiling.
  CONJECT_TIMEOUT: ${{ (github.event.inputs.lane == 'long') && '20100' || ((github.event.inputs.lane == 'heavy') && '3300' || '900') }}

jobs:
  # Does this submission fit one runner? Pure Python: no Lean, no build. A pinned
  # package is fetched and admitted here once, and the wave and shard assignment
  # every later job reads is written here.
  plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      sharded: ${{ steps.plan.outputs.sharded }}
      wave_count: ${{ steps.plan.outputs.wave_count }}
      shard_lists: ${{ steps.plan.outputs.shard_lists }}
      replay_shards: ${{ steps.plan.outputs.replay_shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Plan the submission
        id: plan
        env:
          STATEMENT_ID: ${{ inputs.statement_id }}
          SUBMISSION: ${{ inputs.submission }}
          MAX_SHARDS: ${{ inputs.max_shards }}
          MIN_PER_SHARD: ${{ inputs.min_per_shard }}
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys

          sub = pathlib.Path(os.environ["SUBMISSION"])
          out = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          # Five wave stages exist below; a package is planned into at most that many.
          idle = {"sharded": "false", "wave_count": "0",
                  "shard_lists": json.dumps([[0]] * 5), "replay_shards": json.dumps([0])}

          def emit(d):
              with out.open("a") as f:
                  for k, v in d.items():
                      f.write(f"{k}={v}\n")

          try:
              manifest = json.loads(sub.read_text())
          except Exception as e:
              print(f"::warning::cannot read {sub} ({e}); leaving it to the single-runner path")
              emit(idle); sys.exit(0)

          if not manifest.get("external"):
              print("not a pinned package: one runner does it")
              emit(idle); sys.exit(0)

          r = subprocess.run([
              "python3", "scripts/verify_lean.py",
              "--statement", os.environ["STATEMENT_ID"],
              "--submission", str(sub),
              "--phase", "plan",
              "--plan", ".conject/external/plan.json",
              "--out", "verdict.json",
              "--timeout", os.environ.get("CONJECT_TIMEOUT", "900"),
              *(["--max-shards", os.environ["MAX_SHARDS"]] if os.environ.get("MAX_SHARDS") else []),
              *(["--min-per-shard", os.environ["MIN_PER_SHARD"]] if os.environ.get("MIN_PER_SHARD") else []),
          ])
          if r.returncode != 0:
              # The package was refused (policy, missing source, bad pin). The verdict
              # the driver wrote says why, and the single-runner path delivers it.
              print("::warning::planning failed; the single-runner path will report it")
              emit(idle); sys.exit(0)

          plan = json.loads(pathlib.Path(".conject/external/plan.json").read_text())
          waves = plan["waves"]
          lists = [list(range(len(w))) for w in waves] + [[0]] * (5 - len(waves))
          sharded = sum(len(w) for w in waves) > 1
          print(f"{plan['modules']} modules, {len(waves)} waves, "
                f"{sum(len(w) for w in waves)} build shards, {len(plan['replay'])} replay shards")
          emit({
              "sharded": str(sharded).lower(),
              "wave_count": str(len(waves)),
              "shard_lists": json.dumps(lists[:5]),
              "replay_shards": json.dumps(list(range(len(plan["replay"])))),
          })
          PY

      - name: Share the plan
        if: steps.plan.outputs.sharded == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: conject-plan
          path: .conject/external/plan.json
          retention-days: 1

  # One runner does the whole job: every submission that carries its own source,
  # a small pinned package, and the self-test on push and pull_request.
  verify:
    needs: [plan]
    if: |
      always() &&
      (github.event_name != 'workflow_dispatch' || needs.plan.outputs.sharded != 'true')
    runs-on: ubuntu-latest
    # A backstop, not the budget: CONJECT_TIMEOUT above is what actually bounds a
    # run, and it always stops the driver first so a verdict gets written.
    timeout-minutes: ${{ github.event.inputs.lane == 'long' && 355 || 70 }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          # Submission code runs during the build; it gets no token to find.
          persist-credentials: false

      - uses: ./.github/actions/lean-setup

      # Deliberately not `lake build`. Statements/ and Submissions/ are written
      # by the Conject API on behalf of whoever posed or submitted them, so both
      # globs are untrusted: one file that does not compile would otherwise fail
      # this step and block verification for every other problem in the repo.
      # The glob is also unbounded, and building every submission ever filed ran
      # ~9,900 targets and exhausted the budget below before the driver started.
      # The Lean driver builds the specific statement and submission it needs.
      - name: Build harness
        id: harness
        timeout-minutes: 15
        run: lake build Commons Verify

      # A red verdict fails this step on purpose: "not verified" should read as a failed
      # check. The verdict JSON is still produced and uploaded by the always() steps.
      - name: Verify submission (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          STATEMENT_ID: ${{ inputs.statement_id }}
          SUBMISSION: ${{ inputs.submission }}
          # Read by verify_cert.py: it decides how far a checker spec may raise
          # its own sandbox limits.
          CONJECT_LANE: ${{ inputs.lane || 'default' }}
        run: |
          set -uo pipefail
          ./scripts/verify.sh \
            --statement "$STATEMENT_ID" \
            --submission "$SUBMISSION" \
            --out verdict.json \
            --timeout "$CONJECT_TIMEOUT"

      - name: Self-test (all example submissions)
        if: github.event_name != 'workflow_dispatch'
        run: python3 scripts/selftest.py "$CONJECT_TIMEOUT"

      # Runs even when a previous step was cancelled or timed out, so the job never ends
      # without a machine-readable verdict on disk.
      # A cancelled run knows nothing about the proof, so it must not settle one.
      # This step used to write reason "timeout" for every job that ended without
      # a verdict, cancellations included, and a settle is permanent: it froze a
      # correct proof red, and the later run that proved it green was refused 409.
      - name: Guarantee a verdict exists
        if: always() && !cancelled() && steps.harness.outcome == 'success'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          mkdir -p .conject/verdicts
          if [ -z "$(ls -A .conject/verdicts 2>/dev/null)" ] && [ ! -f verdict.json ]; then
            python3 - <<'PY'
          import datetime, json, os, pathlib
          pathlib.Path("verdict.json").write_text(json.dumps({
              "schema": "conject.verdict.v1",
              "verdict": "red",
              "reason": "timeout",
              "detail": "step=job: the job produced no verdict before its wall limit",
              "next": "A step exceeded its budget. If the build is the slow part, the proof is too slow, not wrong.",
              "agent_actionable": True,
              "run_url": os.environ.get("RUN_URL"),
              "decl": None,
              "axioms": [],
              "elaborated_term_hash": None,
              "timestamp": datetime.datetime.now(datetime.timezone.utc)
                            .strftime("%Y-%m-%dT%H:%M:%SZ"),
          }, indent=2) + "\n")
          PY
          fi

      # Cancelled: say so, deliver nothing, and leave the artifact pending and
      # retriable. An unsettled artifact can still be settled; a wrong settle
      # cannot be taken back.
      - name: Report a cancellation without settling anything
        if: cancelled()
        run: |
          echo "::warning::run cancelled before a verdict existed; nothing delivered, artifact stays pending"

      # A harness failure says nothing about the submission: the driver never
      # ran it. Same rule as a cancellation, leave the artifact pending.
      - name: Report a harness failure without settling anything
        if: always() && !cancelled() && steps.harness.outcome != 'success'
        run: |
          echo "::warning::harness build did not succeed, so the verifier never ran; nothing delivered, artifact stays pending"

      - uses: ./.github/actions/deliver
        if: always() && !cancelled()
        with:
          artifact_id: ${{ inputs.artifact_id }}
          api_url: ${{ secrets.CONJECT_API_URL }}
          webhook_secret: ${{ secrets.CONJECT_WEBHOOK_SECRET }}
          bypass: ${{ secrets.CONJECT_PROTECTION_BYPASS }}

  # A package too large for one runner: each wave builds in parallel on top of the
  # one below it. Five stages, because a job graph cannot be generated at runtime;
  # a package needing more is merged into the last wave by the planner.
  wave0:
    needs: [plan]
    if: needs.plan.outputs.sharded == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: true
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shard_lists || '[[0],[0],[0],[0],[0]]')[0] }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: ./.github/actions/build-shard
        with:
          phase: build
          wave: "0"
          shard: ${{ matrix.shard }}
          statement_id: ${{ inputs.statement_id }}
          submission: ${{ inputs.submission }}
          timeout: ${{ env.CONJECT_TIMEOUT }}

  wave1:
    needs: [plan, wave0]
    if: needs.plan.outputs.sharded == 'true' && fromJSON(needs.plan.outputs.wave_count || '0') > 1
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: true
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shard_lists || '[[0],[0],[0],[0],[0]]')[1] }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: ./.github/actions/build-shard
        with:
          phase: build
          wave: "1"
          shard: ${{ matrix.shard }}
          statement_id: ${{ inputs.statement_id }}
          submission: ${{ inputs.submission }}
          timeout: ${{ env.CONJECT_TIMEOUT }}

  wave2:
    needs: [plan, wave1]
    if: needs.plan.outputs.sharded == 'true' && fromJSON(needs.plan.outputs.wave_count || '0') > 2
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: true
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shard_lists || '[[0],[0],[0],[0],[0]]')[2] }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: ./.github/actions/build-shard
        with:
          phase: build
          wave: "2"
          shard: ${{ matrix.shard }}
          statement_id: ${{ inputs.statement_id }}
          submission: ${{ inputs.submission }}
          timeout: ${{ env.CONJECT_TIMEOUT }}

  wave3:
    needs: [plan, wave2]
    if: needs.plan.outputs.sharded == 'true' && fromJSON(needs.plan.outputs.wave_count || '0') > 3
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: true
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shard_lists || '[[0],[0],[0],[0],[0]]')[3] }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: ./.github/actions/build-shard
        with:
          phase: build
          wave: "3"
          shard: ${{ matrix.shard }}
          statement_id: ${{ inputs.statement_id }}
          submission: ${{ inputs.submission }}
          timeout: ${{ env.CONJECT_TIMEOUT }}

  wave4:
    needs: [plan, wave3]
    if: needs.plan.outputs.sharded == 'true' && fromJSON(needs.plan.outputs.wave_count || '0') > 4
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: true
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shard_lists || '[[0],[0],[0],[0],[0]]')[4] }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: ./.github/actions/build-shard
        with:
          phase: build
          wave: "4"
          shard: ${{ matrix.shard }}
          statement_id: ${{ inputs.statement_id }}
          submission: ${{ inputs.submission }}
          timeout: ${{ env.CONJECT_TIMEOUT }}

  # Shards import oleans other jobs produced. Replaying every declaration through
  # the kernel is what makes that worth the same as a build done here.
  replay:
    needs: [plan, wave0, wave1, wave2, wave3, wave4]
    if: always() && needs.plan.outputs.sharded == 'true' && !contains(needs.*.result, 'failure') && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: true
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.replay_shards || '[0]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: ./.github/actions/build-shard
        with:
          phase: replay
          shard: ${{ matrix.shard }}
          statement_id: ${{ inputs.statement_id }}
          submission: ${{ inputs.submission }}
          timeout: ${{ env.CONJECT_TIMEOUT }}

  # The bridge, the axiom audit and the verdict, on a tree where every module is
  # already built and already replayed.
  finish:
    needs: [plan, replay]
    if: always() && needs.plan.outputs.sharded == 'true' && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: ./.github/actions/lean-setup

      - name: Build harness
        id: harness
        timeout-minutes: 15
        run: lake build Commons Verify

      - name: Fetch the plan
        uses: actions/download-artifact@v4
        with:
          name: conject-plan
          path: .conject/external

      - name: Restore every wave
        uses: actions/download-artifact@v4
        with:
          pattern: oleans-*
          merge-multiple: true
          path: .lake/build/lib/lean

      # A wave or a replay shard that failed says the package does not verify, and
      # the reason is already in that shard's verdict. Settling here would overwrite
      # it with a bridge failure, so the failed shard's verdict is delivered instead.
      - name: Take a failed shard's verdict, if there is one
        if: needs.replay.result != 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: shard-verdict-*
          merge-multiple: true
          path: .

      - name: Finish the verification
        if: needs.replay.result == 'success'
        env:
          STATEMENT_ID: ${{ inputs.statement_id }}
          SUBMISSION: ${{ inputs.submission }}
          CONJECT_LANE: ${{ inputs.lane || 'default' }}
        run: |
          set -uo pipefail
          python3 scripts/verify_lean.py \
            --statement "$STATEMENT_ID" \
            --submission "$SUBMISSION" \
            --phase finish \
            --plan .conject/external/plan.json \
            --out verdict.json \
            --timeout "$CONJECT_TIMEOUT"

      - name: Guarantee a verdict exists
        if: always() && !cancelled() && steps.harness.outcome == 'success'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ ! -f verdict.json ]; then
            python3 - <<'PY'
          import datetime, json, os, pathlib
          pathlib.Path("verdict.json").write_text(json.dumps({
              "schema": "conject.verdict.v1",
              "verdict": "red",
              "reason": "timeout",
              "detail": "step=job: the pipeline produced no verdict before its wall limit",
              "next": "A step exceeded its budget. If the build is the slow part, the proof is too slow, not wrong.",
              "agent_actionable": True,
              "run_url": os.environ.get("RUN_URL"),
              "decl": None,
              "axioms": [],
              "elaborated_term_hash": None,
              "timestamp": datetime.datetime.now(datetime.timezone.utc)
                            .strftime("%Y-%m-%dT%H:%M:%SZ"),
          }, indent=2) + "\n")
          PY
          fi

      - uses: ./.github/actions/deliver
        if: always() && !cancelled()
        with:
          artifact_id: ${{ inputs.artifact_id }}
          api_url: ${{ secrets.CONJECT_API_URL }}
          webhook_secret: ${{ secrets.CONJECT_WEBHOOK_SECRET }}
          bypass: ${{ secrets.CONJECT_PROTECTION_BYPASS }}
