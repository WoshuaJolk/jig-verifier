name: verify

on:
  workflow_dispatch:
    inputs:
      statement_id:
        description: "Statement id, e.g. S001 or C001"
        required: true
        type: string
      submission:
        description: "Path to the submission manifest, e.g. Submissions/S001/AliceDirect.json"
        required: true
        type: string
      ref:
        description: "Git ref holding the submission (defaults to this workflow's ref)"
        required: false
        type: string
      artifact_id:
        description: "Conject artifact uuid to settle. Derived from the submission filename when omitted."
        required: false
        type: string
      lane:
        description: "Verification budget. `heavy` is for work that genuinely needs it; a certificate checked in it is measurement-grade, because the check is the expensive part."
        required: false
        default: "default"
        type: choice
        options: [default, heavy]
  pull_request:
  push:
    branches: [main]

concurrency:
  # Per submission, not per ref. Every API dispatch targets main, so a ref-wide
  # group made three artifacts submitted seconds apart cancel each other and left
  # two pending forever. Push and PR runs carry no inputs and still coalesce.
  group: verify-${{ github.ref }}-${{ github.event_name }}-${{ github.event.inputs.artifact_id || github.event.inputs.submission || 'branch' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The driver's own wall budget, always under the job timeout so it writes a RED
  # verdict itself rather than being killed mid-flight.
  #
  # The budget is not a cost control: these are GitHub's runners, and the graph
  # pays nothing either way. It is a trust control. A verification nobody can
  # afford to repeat is not much better than testimony, so the default stays
  # tight and anything slower has to ask, in the open, on the record.
  CONJECT_TIMEOUT: ${{ (github.event.inputs.lane == 'heavy') && '3300' || '900' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    # A backstop, not the budget: CONJECT_TIMEOUT above is what actually bounds a
    # run, and it always stops the driver first so a verdict gets written.
    timeout-minutes: 70

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install elan
        run: |
          set -euo pipefail
          curl -sSfL https://elan.lean-lang.org/elan-init.sh -o elan-init.sh
          bash elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Mathlib
        uses: actions/cache@v4
        with:
          # The unpacked dependency oleans. On a hit `lake exe cache get` becomes a
          # no-op instead of a multi-gigabyte download.
          path: .lake/packages
          key: mathlib-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Cache Conject build output
        uses: actions/cache@v4
        with:
          path: .lake/build
          key: conject-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('Commons/**', 'Statements/**', 'Submissions/**', 'Verify/**') }}
          restore-keys: |
            conject-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Fetch Mathlib oleans
        timeout-minutes: 12
        run: |
          set -euo pipefail
          lake exe cache get

      # Deliberately not `lake build`. Statements/ and Submissions/ are written
      # by the Conject API on behalf of whoever posed or submitted them, so both
      # globs are untrusted: one file that does not compile would otherwise fail
      # this step and block verification for every other problem in the repo.
      # The glob is also unbounded, and building every submission ever filed ran
      # ~9,900 targets and exhausted the budget below before the driver started.
      # The Lean driver builds the specific statement and submission it needs.
      - name: Build harness
        id: harness
        timeout-minutes: 15
        run: lake build Commons Verify

      # A red verdict fails this step on purpose: "not verified" should read as a failed
      # check. The verdict JSON is still produced and uploaded by the always() steps.
      - name: Verify submission (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          STATEMENT_ID: ${{ inputs.statement_id }}
          SUBMISSION: ${{ inputs.submission }}
          # Read by verify_cert.py: it decides how far a checker spec may raise
          # its own sandbox limits.
          CONJECT_LANE: ${{ inputs.lane || 'default' }}
        run: |
          set -uo pipefail
          ./scripts/verify.sh \
            --statement "$STATEMENT_ID" \
            --submission "$SUBMISSION" \
            --out verdict.json \
            --timeout "$CONJECT_TIMEOUT"

      - name: Self-test (all example submissions)
        if: github.event_name != 'workflow_dispatch'
        run: python3 scripts/selftest.py "$CONJECT_TIMEOUT"

      # Runs even when a previous step was cancelled or timed out, so the job never ends
      # without a machine-readable verdict on disk.
      # A cancelled run knows nothing about the proof, so it must not settle one.
      # This step used to write reason "timeout" for every job that ended without
      # a verdict, cancellations included, and a settle is permanent: it froze a
      # correct proof red, and the later run that proved it green was refused 409.
      - name: Guarantee a verdict exists
        if: always() && !cancelled() && steps.harness.outcome == 'success'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          mkdir -p .conject/verdicts
          if [ -z "$(ls -A .conject/verdicts 2>/dev/null)" ] && [ ! -f verdict.json ]; then
            python3 - <<'PY'
          import datetime, json, os, pathlib
          pathlib.Path("verdict.json").write_text(json.dumps({
              "schema": "conject.verdict.v1",
              "verdict": "red",
              "reason": "timeout",
              "detail": "step=job: the job produced no verdict before its wall limit",
              "next": "A step exceeded its budget. If the build is the slow part, the proof is too slow, not wrong.",
              "agent_actionable": True,
              "run_url": os.environ.get("RUN_URL"),
              "decl": None,
              "axioms": [],
              "elaborated_term_hash": None,
              "timestamp": datetime.datetime.now(datetime.timezone.utc)
                            .strftime("%Y-%m-%dT%H:%M:%SZ"),
          }, indent=2) + "\n")
          PY
          fi

      # Cancelled: say so, deliver nothing, and leave the artifact pending and
      # retriable. An unsettled artifact can still be settled; a wrong settle
      # cannot be taken back.
      - name: Report a cancellation without settling anything
        if: cancelled()
        run: |
          echo "::warning::run cancelled before a verdict existed; nothing delivered, artifact stays pending"

      # A harness failure says nothing about the submission: the driver never
      # ran it. Same rule as a cancellation, leave the artifact pending.
      - name: Report a harness failure without settling anything
        if: always() && !cancelled() && steps.harness.outcome != 'success'
        run: |
          echo "::warning::harness build did not succeed, so the verifier never ran; nothing delivered, artifact stays pending"

      - name: Verdict summary
        if: always()
        run: |
          set -uo pipefail
          {
            echo "## Conject verdicts"
            echo
            echo "| verdict | reason | statement | submission | term hash |"
            echo "| --- | --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import glob, json
          for f in sorted(glob.glob(".conject/verdicts/*.json")) + glob.glob("verdict.json"):
              try:
                  v = json.load(open(f))
              except Exception:
                  continue
              h = (v.get("elaborated_term_hash") or "-")[:24]
              print(f"| **{v.get('verdict')}** | `{v.get('reason')}` | "
                    f"{v.get('statement_id')} | `{v.get('submission')}` | `{h}` |")
          PY

      # The verdict is worthless sitting in an artifact: it has to reach the
      # graph or the submission stays `pending` forever and nothing auto-closes.
      # Signed with the shared secret; the receiver compares in constant time
      # and is idempotent, so a retry cannot double-settle.
      - name: Deliver verdicts
        if: always()
        env:
          CONJECT_API_URL: ${{ secrets.CONJECT_API_URL }}
          CONJECT_WEBHOOK_SECRET: ${{ secrets.CONJECT_WEBHOOK_SECRET }}
          CONJECT_BYPASS: ${{ secrets.CONJECT_PROTECTION_BYPASS }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          set -uo pipefail
          if [ -z "${CONJECT_API_URL:-}" ] || [ -z "${CONJECT_WEBHOOK_SECRET:-}" ]; then
            echo "::notice::CONJECT_API_URL / CONJECT_WEBHOOK_SECRET not set; verdicts not delivered."
            exit 0
          fi
          export RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python3 - <<'PY'
          import glob, hmac, hashlib, json, os, re, sys, urllib.error, urllib.request

          base   = os.environ["CONJECT_API_URL"].rstrip("/")
          secret = os.environ["CONJECT_WEBHOOK_SECRET"].encode()
          bypass = os.environ.get("CONJECT_BYPASS") or ""
          forced = (os.environ.get("ARTIFACT_ID") or "").strip()
          UUID   = re.compile(r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}", re.I)

          files = sorted(glob.glob(".conject/verdicts/*.json")) + glob.glob("verdict.json")
          if not files:
              print("::warning::no verdict files to deliver")
              sys.exit(0)

          failed = 0
          for f in files:
              try:
                  v = json.load(open(f))
              except Exception as e:
                  print(f"::warning::{f}: unreadable ({e})")
                  continue

              # The API names submissions Submissions/<label>/<artifact-id>.json
              # precisely so the id survives the round trip through CI.
              aid = forced or next(iter(UUID.findall(str(v.get("submission") or ""))), None)
              if not aid:
                  print(f"::warning::{f}: no artifact id in '{v.get('submission')}'; not delivered")
                  continue
              v["artifact_id"] = aid
              # Where this verdict came from. Without it the only way back to the
              # run is to guess, and the uploaded TypeCheck.lean is unreachable.
              v.setdefault("run_url", os.environ.get("RUN_URL"))

              raw = json.dumps(v).encode()
              sig = hmac.new(secret, raw, hashlib.sha256).hexdigest()
              req = urllib.request.Request(
                  f"{base}/api/webhooks/verdict",
                  data=raw,
                  method="POST",
                  headers={
                      "content-type": "application/json",
                      "x-conject-signature": f"sha256={sig}",
                      **({"x-vercel-protection-bypass": bypass} if bypass else {}),
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      body = json.loads(r.read() or b"{}")
                  print(f"delivered {aid}: {v.get('verdict')} -> "
                        f"settled={body.get('settled')} idempotent={body.get('idempotent')}")
              except urllib.error.HTTPError as e:
                  detail = e.read().decode(errors="replace")[:300]
                  print(f"::error::{aid}: {e.code} {detail}")
                  failed += 1
              except Exception as e:
                  print(f"::error::{aid}: {e}")
                  failed += 1

          # Delivery failure must be loud. A silent drop leaves the graph wrong.
          sys.exit(1 if failed else 0)
          PY

      - name: Upload verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conject-verdicts
          path: |
            verdict.json
            .conject/verdicts/
            .conject/work/**/*.lean
          if-no-files-found: warn
